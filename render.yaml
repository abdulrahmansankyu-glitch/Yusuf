# One-click deploy: https://dashboard.render.com/blueprints → New Blueprint Instance
#
# One web service. The app is plain JavaScript on both sides, so there is no
# build step — a deploy is an install and a start, and any failure names the
# command that actually broke rather than a layer in an image.
#
# ---------------------------------------------------------------------------
# The database is NOT created here. You paste a connection string.
#
# Render allows one free Postgres per account, so a blueprint that creates its
# own fails outright for anybody who already has one:
#
#   Create database planning-db
#     ✗ cannot have more than one active free tier database
#
# and the web service is cancelled behind it. Asking for the connection string
# instead works whether the database is new or already exists, on Render or off
# it, free or paid.
#
# Any Postgres will do. The tables are created on boot inside their own
# `planning` schema, so sharing a database with another application is safe:
# a migration tool pointed at `public` cannot reach them.
#
#   * Neon (neon.tech) — free, and it PERSISTS. The best answer, because
#     Render's own free database is deleted after 30 days.
#   * An existing Render Postgres — use its Internal Database URL.
# ---------------------------------------------------------------------------
#
# One more free-tier limit worth knowing: services sleep after 15 minutes idle
# and take about 50 seconds to wake. `.github/workflows/keep-awake.yml` covers
# the working day; see DEPLOY.md.

services:
  - type: web
    name: engineering-planning-tracker
    runtime: node
    plan: free
    region: frankfurt
    rootDir: .

    # The cheapest route that touches the app: no database query and no session,
    # so a slow query cannot make a healthy service look dead.
    healthCheckPath: /api/health

    buildCommand: npm ci --omit=dev
    startCommand: npm start

    envVars:
      # Required. The Postgres to use — see the note at the top of this file.
      # Render asks for it when you create or sync the blueprint; you can also
      # set it later under the service's Environment tab.
      #
      #   postgres://user:password@host/dbname
      #
      # Without it the app falls back to a JSON file inside the container, which
      # this host destroys on every deploy and every wake from sleep. `/api/health`
      # reports which one is in use, and that is the thing to check first.
      - key: DATABASE_URL
        sync: false

      # Managed Postgres presents a certificate this app does not chain-verify.
      # Neon and Render both need this; a server with TLS switched off entirely
      # (a local container) needs `disable` instead.
      - key: DATABASE_SSL
        value: no-verify

      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      # Generated once and kept stable across deploys. Changing it signs
      # everybody out; leaving it unset regenerates it on every restart, which
      # signs everybody out several times a day.
      - key: SESSION_SECRET
        generateValue: true

      # The plant's clock, so "due today" means today at the plant rather than in
      # UTC. Saudi Arabia is UTC+3 and does not observe daylight saving.
      - key: TZ
        value: Asia/Riyadh

      # The code the first person types to claim the administrator account.
      # Render asks for a value when you create the blueprint. Set one: without
      # it, whoever opens the URL first becomes the administrator.
      - key: ACCESS_CODE
        sync: false

      # Optional — set both and the administrator is created on first boot
      # instead of through the setup screen. Leave them blank to use the screen.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        sync: false
