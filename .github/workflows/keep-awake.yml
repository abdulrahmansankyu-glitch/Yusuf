# Keep the tracker awake through the day.
#
# A free Render service sleeps after fifteen minutes without traffic, and the
# next person to open it waits about fifty seconds looking at Render's own
# "service waking up" screen. That page is served by Render before the app is
# running, so it cannot be styled or skipped from the app — the only thing that
# helps is the service not being asleep.
#
# WHY THIS RUNS IN A LOOP RATHER THAN ON A FIVE-MINUTE CRON
#
# It used to ask for `*/5`. GitHub does not honour that. Scheduled workflows are
# best-effort and heavily deprioritised, and in this repository the runs landed
# 20 to 60 minutes apart:
#
#   03:47  04:30  05:20  05:57  06:57      (UTC, one morning)
#
# Against a fifteen-minute sleep timer the service slept in nearly every gap,
# and the ping's own response time showed it — 23 seconds, which is a wake, not
# a healthy answer.
#
# So the schedule is hourly, and each run stays alive pinging every five minutes
# until the next one takes over. GitHub delaying the hourly trigger no longer
# opens a hole, because the previous run is still going. Actions minutes are
# unlimited on a public repository, so the long job costs nothing.
#
# The URL is in `env` below rather than a repository secret: it is printed on the
# service's own page and handed to everybody who uses the app, and requiring a
# secret meant this shipped switched off. A `TRACKER_URL` secret still overrides
# it.
#
# This is a workaround for a free plan, not a fix. A paid Render instance never
# sleeps, and this file can be deleted the day you move to one. A purpose-built
# uptime pinger is the other honest answer, and is more reliable than this.

name: Keep awake

on:
  schedule:
    # Hourly, 03:00-19:00 UTC. Saudi Arabia is UTC+3 and does not observe
    # daylight saving, so that is 06:00-22:00 local — the working day with the
    # evening on the end of it.
    #
    # It stops overnight deliberately. The free tier allows 750 instance-hours a
    # month per workspace; this window is about 517 of them and leaves room for
    # the service's own real traffic. Around the clock is about 730, which would
    # spend the whole allowance and suspend the service until the first of the
    # next month — a dead URL for the last week of every month is far worse than
    # a wait at six in the morning.
    - cron: '0 3-19 * * *'
  workflow_dispatch:

concurrency:
  # A new run takes over from the one still looping, so the pings stay continuous
  # across the handover instead of pausing for it.
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    # Longer than the hour between triggers, so a late trigger finds this one
    # still working rather than finding nothing running at all.
    timeout-minutes: 75

    steps:
      - name: Ping the health endpoint every five minutes
        env:
          # The live service. A repository secret of the same name overrides it.
          TRACKER_URL: ${{ secrets.TRACKER_URL || 'https://engineering-tracker.onrender.com' }}
          PINGS: '14'
          INTERVAL: '300'
        # `/api/health` is the cheapest route that touches the app: no database
        # query and no session. `--max-time 90` covers the case where this ping
        # is itself the request that wakes a sleeping instance.
        #
        # Nothing here fails the job. It runs all day, and a red cross every time
        # Render blips would train everybody to ignore the Actions tab —
        # including when the test job goes red. A ping that answers anything
        # other than 200 is a warning, and the loop carries on.
        run: |
          if [ -z "$TRACKER_URL" ]; then
            echo "::warning::TRACKER_URL is not set — nothing to ping."
            exit 0
          fi

          woke=0
          failed=0
          for i in $(seq 1 "$PINGS"); do
            start=$(date +%s)
            # No `|| echo 000` fallback: curl already writes 000 through -w when
            # it cannot connect, and the two together printed "000000" — a
            # status code that does not exist. `|| true` keeps `set -e` from
            # ending the run on a blip instead.
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$TRACKER_URL/api/health" 2>/dev/null) || true
            took=$(( $(date +%s) - start ))

            # A healthy instance answers in well under a second. Several seconds
            # means this request was the one that woke it — which is the thing
            # this workflow exists to prevent, so it is worth seeing in the log.
            note=''
            if [ "$took" -ge 5 ]; then
              note=' (was asleep — this ping woke it)'
              woke=$((woke + 1))
            fi
            echo "$(date -u +%H:%M:%S)  ping $i/$PINGS -> ${code:-no answer} in ${took}s$note"

            if [ "$code" != "200" ]; then
              echo "::warning::Ping $i answered ${code:-nothing}."
              failed=$((failed + 1))
            fi

            [ "$i" -lt "$PINGS" ] && sleep "$INTERVAL"
          done

          # Report what actually happened. Saying "stayed awake" after a run in
          # which every ping failed would be worse than saying nothing.
          if [ "$failed" -eq "$PINGS" ]; then
            echo "::warning::Not one ping reached $TRACKER_URL — check the URL and the service."
          elif [ "$failed" -gt 0 ]; then
            echo "::warning::$failed of $PINGS pings did not answer 200."
          elif [ "$woke" -gt 0 ]; then
            echo "::warning::The service was found asleep $woke time(s) this run."
          else
            echo "Stayed awake for the whole run."
          fi
