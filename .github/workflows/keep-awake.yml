# Keep the tracker awake during the working day.
#
# A free Render service sleeps after 15 minutes without traffic, and the next
# person to open it waits about 50 seconds looking at Render's own "service
# waking up" screen — served before this app is running, so it cannot be styled
# or skipped from here. Any inbound request resets the idle timer, so a small
# ping keeps the service up and nobody on the plant ever meets that screen.
#
# It deliberately does NOT run around the clock. Render's free tier allows 750
# instance-hours a month per workspace; awake 24/7 is about 730 of them, which
# would spend the whole allowance and starve anything else in the same
# workspace. Sunday to Thursday, 05:00-18:00 local, is roughly 280 hours — the
# service still sleeps overnight and at the weekend, when nobody is looking.
#
# The URL lives in `env` below, not in a repository secret. It is printed on
# the service's own page and handed to anybody who uses the app — there is
# nothing to keep secret about it, and requiring a secret meant this workflow
# shipped switched off and stayed switched off. Set a `TRACKER_URL` repository
# secret only if you want to override it without editing this file.
#
# This is a workaround for a free plan, not a fix. A paid Render instance never
# sleeps, and this file can be deleted the day you move to one.

name: Keep awake

on:
  schedule:
    # Every 5 minutes, 03:00-19:55 UTC, every day.
    #
    # GitHub runs cron in UTC with no local-time option, so the plant's hours are
    # converted by hand: Saudi Arabia is UTC+3 and does not observe daylight
    # saving, making this 06:00-22:55 local — the working day with the evening on
    # the end of it, because the app gets opened after hours too.
    #
    # That window is about 500 instance-hours a month against the free tier's
    # 750, which leaves room for the service's own real traffic. Widening it to
    # the full 24 hours would spend the entire allowance and suspend the service
    # before month end, so this is the practical limit without paying.
    #
    # Five minutes rather than ten because GitHub's scheduled runs are best
    # effort and are often late under load — at a ten minute interval one
    # delayed run is enough to let the service sleep.
    - cron: '*/5 3-19 * * *'
  workflow_dispatch:

concurrency:
  group: keep-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the health endpoint
        env:
          # The live service. A repository secret of the same name overrides it.
          TRACKER_URL: ${{ secrets.TRACKER_URL || 'https://engineering-tracker.onrender.com' }}
        # `/api/health` is the cheapest route that touches the app: no database
        # query and no session. `--max-time 90` covers the case where this ping
        # is itself the request that wakes a sleeping instance.
        #
        # A failed ping warns rather than fails the job. This runs 150 times a
        # week, and a red cross every time Render blips would train everybody to
        # ignore the Actions tab — including when the test job goes red.
        run: |
          if [ -z "$TRACKER_URL" ]; then
            echo "::warning::TRACKER_URL is not set — nothing to ping."
            exit 0
          fi
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$TRACKER_URL/api/health" 2>&1 | tail -n1)
          echo "$TRACKER_URL/api/health -> ${code:-no answer}"
          if [ "$code" != "200" ]; then
            echo "::warning::Health check answered ${code:-nothing}."
          fi
