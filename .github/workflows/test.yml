name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 20 is the lowest version package.json accepts; 22 is what the Render
        # blueprint and the Dockerfile run. Testing both means neither the floor
        # nor production is a version nothing has ever been proved against.
        node: [20, 22]

    name: test (node ${{ matrix.node }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm test
