name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The lowest version package.json accepts, so a syntax or API feature
          # newer than that fails here rather than on somebody's machine.
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test
